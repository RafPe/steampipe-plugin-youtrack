name: steampipe-youtrack-e2e

services:
  youtrack:
    image: jetbrains/youtrack:2026.1.13874
    ports:
      - "${YOUTRACK_PORT:-18080}:8080"
    volumes:
      - youtrack_data:/opt/youtrack/data
      - youtrack_conf:/opt/youtrack/conf
      - youtrack_logs:/opt/youtrack/logs
      - youtrack_backups:/opt/youtrack/backups
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  steampipe:
    image: turbot/steampipe:0.22.0
    user: "${E2E_UID:-1000}:${E2E_GID:-1000}"
    environment:
      HOME: /e2e/home
      STEAMPIPE_INSTALL_DIR: /e2e/home/.steampipe
    volumes:
      - ./tests/e2e/.state/home:/e2e/home
    working_dir: /e2e/home
    depends_on:
      youtrack:
        condition: service_healthy
    entrypoint: ["steampipe"]

volumes:
  youtrack_data:
  youtrack_conf:
  youtrack_logs:
  youtrack_backups:
