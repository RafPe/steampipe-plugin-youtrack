name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: make fmt
      - name: Unit tests
        run: make test
      - name: Contract tests
        run: make test-contract
      - name: Coverage
        run: make coverage
      - name: Race detector
        run: make test-race
      - name: Vet
        run: make vet
      - uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: v2.12.2
          args: --timeout=5m
      - name: Build
        run: make build
      - name: Documentation
        run: make docs

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - run: go run github.com/securego/gosec/v2/cmd/gosec@v2.22.8 ./...
