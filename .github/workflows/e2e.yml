name: E2E

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (commit SHA, branch, or tag) to check out for the E2E run.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to check out. Defaults to the ref that triggered this run.
        required: false
        type: string
        default: ""
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # No environment, no secret: the job provisions its own throwaway
    # YouTrack instance and permanent token at runtime (tests/e2e/provision.sh)
    # and never touches a stored credential. See docs/e2e.md.
    permissions:
      contents: read
    steps:
      # inputs.ref resolves to whichever trigger fired (workflow_call's
      # required input or workflow_dispatch's optional one); for `schedule`,
      # which declares no inputs, this is empty and actions/checkout falls
      # back to its own default ref resolution.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Provision ephemeral YouTrack
        id: provision
        run: |
          set -eu
          token=$(./tests/e2e/provision.sh)
          # Mask before the token can appear anywhere else in the log,
          # including this step's own output assignment below.
          echo "::add-mask::$token"
          echo "token=$token" >>"$GITHUB_OUTPUT"
      - name: End-to-end tests
        env:
          YOUTRACK_TOKEN: ${{ steps.provision.outputs.token }}
        run: make e2e
      - name: Cleanup
        if: always()
        run: |
          docker compose --project-directory "$GITHUB_WORKSPACE" -f "$GITHUB_WORKSPACE/docker-compose.yml" down --volumes --remove-orphans || true
          rm -rf "$GITHUB_WORKSPACE/tests/e2e/.state"
