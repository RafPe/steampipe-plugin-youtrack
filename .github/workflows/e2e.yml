name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: End-to-end tests
        run: make e2e
